name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # No --publish flag here on purpose: passing it makes Quasar overwrite
      # quasar.config.js's electron.builder.publish (which sets releaseType:
      # 'release') with a bare string, which then races electron-builder's
      # own implicit tag-triggered publish and fails with a 422 on the
      # GitHub release already existing. electron-builder auto-publishes on
      # its own once it detects it's building from a tag with GH_TOKEN set.
      - run: npx quasar build -m electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
